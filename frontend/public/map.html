<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex AI · 地图工具</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --pane: #fff;
        --line: #e8ecf4;
        --primary: #5b6cff;
        --muted: #6b7280;
        --text: #1f2937;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; font-family: "Noto Sans SC", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
      .wrap { display: flex; height: 100%; min-height: 0; }
      .left { width: 42%; min-width: 320px; display: flex; flex-direction: column; background: var(--pane); border-right: 1px solid var(--line); }
      .right { flex: 1; position: relative; min-width: 0; }
      .head { padding: 16px 20px; border-bottom: 1px solid var(--line); }
      .head h1 { margin: 0 0 4px; font-size: 20px; }
      .head p { margin: 0; color: var(--muted); font-size: 13px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .chip { border: 1px solid var(--line); background: #f8fafc; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
      .msgs { flex: 1; overflow: auto; padding: 16px; }
      .row { display: flex; margin-bottom: 12px; }
      .row.user { justify-content: flex-end; }
      .bubble { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
      .row.user .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
      .row.ai .bubble { background: #f1f5f9; border-bottom-left-radius: 4px; }
      .composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
      .composer textarea { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; }
      .composer .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
      .btn { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { position: absolute; z-index: 2; left: 12px; top: 12px; background: rgba(255,255,255,0.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; max-width: 70%; }
      #map { width: 100%; height: 100%; }
      .err { color: #c0392b; font-size: 13px; margin: 0 0 8px; }
      .login-tip { padding: 40px 24px; text-align: center; color: var(--muted); }
      @media (max-width: 860px) {
        .wrap { flex-direction: column; }
        .left { width: 100%; height: 52%; }
        .right { height: 48%; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="left">
        <div class="head">
          <h1>🗺️ 地图工具</h1>
          <p>内置地点：保定 / 白洋淀 / 狼牙山 · JWT 登录后可用</p>
        </div>
        <div class="chips" id="chips"></div>
        <div class="msgs" id="msgs">
          <div class="login-tip" id="tip">正在检查登录状态…</div>
        </div>
        <div class="composer">
          <p class="err" id="err" hidden></p>
          <textarea id="input" rows="2" placeholder="例如：白洋淀在哪？"></textarea>
          <div class="bar">
            <small style="color:var(--muted)">Enter 发送 · Shift+Enter 换行</small>
            <button class="btn" id="send" type="button">发送</button>
          </div>
        </div>
      </section>
      <section class="right">
        <div class="status" id="status">地图准备中…</div>
        <div id="map"></div>
      </section>
    </div>
    <script>
      const API = (() => {
        const { protocol, hostname, port } = location;
        if (port === "8000" || (!port && hostname)) return "";
        if (port === "5173") return "http://127.0.0.1:8000";
        return "";
      })();

      function session() {
        try { return JSON.parse(localStorage.getItem("apex_user") || "null"); } catch { return null; }
      }
      function token() {
        const s = session();
        return s?.access_token || s?.token || "";
      }
      async function api(path, opts = {}) {
        const res = await fetch(API + path, {
          ...opts,
          headers: {
            "Content-Type": "application/json",
            ...(token() ? { Authorization: "Bearer " + token() } : {}),
            ...(opts.headers || {}),
          },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : (data.msg || "请求失败"));
        return data;
      }

      const msgsEl = document.getElementById("msgs");
      const tipEl = document.getElementById("tip");
      const errEl = document.getElementById("err");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const statusEl = document.getElementById("status");
      const chipsEl = document.getElementById("chips");
      let cid = null;
      let map = null;
      let markers = [];

      function pushMsg(role, content) {
        tipEl?.remove();
        const row = document.createElement("div");
        row.className = "row " + (role === "human" ? "user" : "ai");
        const b = document.createElement("div");
        b.className = "bubble";
        b.textContent = String(content || "").replace(/\[\[map:[^\]]+\]\]/g, "").trim();
        row.appendChild(b);
        msgsEl.appendChild(row);
        msgsEl.scrollTop = msgsEl.scrollHeight;
      }

      function flyTo(point) {
        if (!map || !point || !window.AMap) return;
        const pos = [Number(point.lng), Number(point.lat)];
        const m = new AMap.Marker({ position: pos, title: point.name || "" });
        map.add(m);
        markers.push(m);
        map.setZoomAndCenter(13, pos);
        statusEl.textContent = (point.name || "目标") + " · " + point.lng + ", " + point.lat;
      }

      function loadAmap(key, security) {
        return new Promise((resolve, reject) => {
          if (window.AMap) return resolve(window.AMap);
          if (security) window._AMapSecurityConfig = { securityJsCode: security };
          const s = document.createElement("script");
          s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(key);
          s.onload = () => resolve(window.AMap);
          s.onerror = () => reject(new Error("高德脚本加载失败"));
          document.head.appendChild(s);
        });
      }

      async function init() {
        const s = session();
        if (!s || !token()) {
          tipEl.textContent = "未登录。请先打开主站登录，再访问 /map.html";
          sendBtn.disabled = true;
          statusEl.textContent = "需要登录";
          return;
        }
        tipEl.textContent = "已登录。试试问「白洋淀在哪？」";
        const cfg = await api("/api/map/config");
        (cfg.data.places || []).forEach((p) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip";
          btn.textContent = "📍 " + p.name;
          btn.onclick = () => ask(p.name + "在哪？");
          chipsEl.appendChild(btn);
        });
        const key = (cfg.data.amap_js_key || "").trim();
        if (!key) {
          statusEl.textContent = "未配置 AMAP_JS_KEY（backend/.env）";
          return;
        }
        await loadAmap(key, cfg.data.security_js_code);
        map = new AMap.Map("map", { zoom: 10, center: [115.4648, 38.8739] });
        statusEl.textContent = "地图就绪";
        (cfg.data.places || []).forEach((p) => {
          const m = new AMap.Marker({ position: [p.lng, p.lat], title: p.name });
          map.add(m);
          markers.push(m);
        });
      }

      async function ask(q) {
        q = (q || inputEl.value || "").trim();
        if (!q) return;
        errEl.hidden = true;
        sendBtn.disabled = true;
        inputEl.value = "";
        pushMsg("human", q);
        try {
          const res = await api("/api/chat", {
            method: "POST",
            body: JSON.stringify({
              user_id: session().user_id,
              conversation_id: cid || undefined,
              question: q,
            }),
          });
          cid = res.data.conversation_id;
          pushMsg("ai", res.data.answer);
          if (res.data.map) flyTo(res.data.map);
        } catch (e) {
          errEl.hidden = false;
          errEl.textContent = e.message || "失败";
          pushMsg("ai", "请求失败：" + (e.message || ""));
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.onclick = () => ask();
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          ask();
        }
      });
      init().catch((e) => {
        tipEl.textContent = e.message || "初始化失败";
        statusEl.textContent = e.message || "失败";
      });
    </script>
  </body>
</html>
