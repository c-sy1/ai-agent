name: Deploy to Aliyun ECS

# 在轻量服务器本机跑（self-hosted），避免 GitHub 国外 IP 被拦 SSH
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and restart
        run: |
          set -e
          cd /opt/apex-ai
          git remote set-url origin https://github.com/c-sy1/ai-agent.git
          chmod +x deploy.sh
          bash deploy.sh
